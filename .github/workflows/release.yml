name: Release

# Runs only on push to main. release-please parses conventional commits since the
# last tag and either opens/updates a Release PR (CHANGELOG.md + version bump) or,
# once that PR is merged, cuts the vX.Y.Z tag + GitHub Release for this merge
# commit. When a release is actually cut, build-and-push runs in the same job
# graph (not a separate `release: published`-triggered workflow) because a
# GITHUB_TOKEN-authored tag/release does not itself trigger new workflow runs -
# chaining it as a downstream job sidesteps that entirely. See
# dimasdom/SpreadScanner/.github/workflows/release-service.yml for what that job
# does, and this repo's deploy.yml for how a cut version actually gets deployed.
# admin-api needs the sibling ArbiScannerWebApp repo checked out for its Docker
# build (AdminPanel.API references ArbiScannerWebApp projects - see CLAUDE.md).

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: dimasdom/SpreadScanner/.github/workflows/release-service.yml@be8acb9c9928400f197ba8a5d64535410458b916 # master
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      self_checkout_path: ArbiScannerAdminPannel
      solution_file: ArbiScannerAdminPanel.sln
      unit_test_project: ArbiScannerAdminPanel.Tests/ArbiScannerAdminPanel.Tests.csproj
      integration_test_project: ArbiScannerAdminPanel.IntegrationTests/ArbiScannerAdminPanel.IntegrationTests.csproj
      has_client_tests: true
      client_dir: ArbiScannerAdminPannel/ArbiScannerAdminPanel.Client
      sibling_repos: '[{"repo":"dimasdom/ArbiSpreadScanner.WebApp","path":"ArbiScannerWebApp"}]'
      needs_keycloak_realm_export: true
      images: >-
        [{"name":"arbiscanner-admin-api","dockerfile":"ArbiScannerAdminPannel/Dockerfile","context":".","needs_root_checkout":false,"build_args":""},
         {"name":"arbiscanner-admin-client","dockerfile":"ArbiScannerAdminPannel/Dockerfile.client","context":"ArbiScannerAdminPannel","needs_root_checkout":false,"build_args":"VITE_API_URL=/adminapi\nVITE_OIDC_AUTHORITY=https://auth.arbiscannerwebapp.site/realms/arbiscanner-admin\nVITE_OIDC_CLIENT_ID=arbiscanner-admin-spa\nVITE_OIDC_REDIRECT_URI=https://www.arbiscannerwebapp.site/admin/auth/callback"}]
